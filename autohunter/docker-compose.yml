services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autohunter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autohunter}
      POSTGRES_DB: autohunter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autohunter -d autohunter"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://autohunter:${POSTGRES_PASSWORD:-autohunter}@db:5432/autohunter
    ports:
      - "${APP_PORT:-8000}:8000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    stop_grace_period: 20s

volumes:
  pgdata:
